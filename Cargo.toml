[workspace]
resolver = "3"
members = ["bootrom"]

[workspace.package]
version = "0.2.0"
authors = ["Joe Richey <joerichey@google.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/josephlr/x86-boot"

[workspace.dependencies]
x86_64 = { version = "0.15", default-features = false }
uart_16550 = "0.4"

[package]
name = "x86-boot"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
x86_64.workspace = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
